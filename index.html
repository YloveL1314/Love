<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💖 妙妙七夕快乐 💖</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #0a0a1a;
  font-family: 'Georgia', serif;
  color: #fff;
  touch-action: none;
}
#canvas3d {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
#videoFeed {
  position: fixed;
  bottom: 20px; right: 20px;
  width: 160px; height: 120px;
  border: 2px solid rgba(255,182,193,0.4);
  border-radius: 12px;
  z-index: 100;
  transform: scaleX(-1);
  object-fit: cover;
  opacity: 0.8;
}
#gestureIndicator {
  position: fixed;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 16px;
  padding: 10px 20px;
  border-radius: 30px;
  background: rgba(20,10,40,0.8);
  border: 1px solid rgba(255,182,193,0.3);
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
#gestureIndicator.open { border-color: rgba(255,215,0,0.8); color: #ffd700; }
#gestureIndicator.fist { border-color: rgba(255,105,180,0.8); color: #ff69b4; }
#loading {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.8s ease;
}
#loading h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #ffd700, #ff69b4, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}
#loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,182,193,0.2);
  border-top-color: #ff69b4;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#hint {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  pointer-events: none;
  text-align: center;
  max-width: 90%;
}
@media (max-width: 768px) {
  #videoFeed { width: 120px; height: 90px; bottom: 10px; right: 10px; }
  #gestureIndicator { font-size: 14px; padding: 8px 16px; }
  #loading h1 { font-size: 1.5em; }
}
</style>
</head>
<body>

<div id="loading">
  <h1>💖 Loading Memories...</h1>
  <div class="spinner"></div>
</div>

<canvas id="canvas3d"></canvas>
<video id="videoFeed" autoplay playsinline muted></video>
<div id="gestureIndicator">✨ 准备中...</div>
<div id="hint">首次加载需要下载手势模型，请耐心等待</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================
// CONFIG
// ============================================================
const PHOTO_COUNT = 34;
const HEART_SCALE = 3.5;
const EXPLOSION_RADIUS = 18;
const LERP_SPEED = 0.025;
const HEARTBEAT_SPEED = 1.2;
const HEARTBEAT_AMPLITUDE = 0.06;
const PARTICLE_COUNT = 1500;
const ROSE_GOLD = new THREE.Color(0.95, 0.72, 0.60);

// ============================================================
// SCENE SETUP
// ============================================================
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060614);
scene.fog = new THREE.FogExp2(0x060614, 0.025);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85
);
composer.addPass(bloomPass);

// ============================================================
// LIGHTING
// ============================================================
scene.add(new THREE.AmbientLight(0x332244, 0.6));

const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
mainLight.position.set(5, 8, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0xff69b4, 0.4);
fillLight.position.set(-5, -3, 3);
scene.add(fillLight);

const coreLight = new THREE.PointLight(0xff69b4, 3, 15);
scene.add(coreLight);

const coreLight2 = new THREE.PointLight(0xffd700, 1.5, 10);
scene.add(coreLight2);

// ============================================================
// HEART POSITIONS
// ============================================================
function generateHeartPositions(count) {
  const positions = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const u = t * Math.PI * 2;
    const v = (i * goldenAngle) % Math.PI;
    
    const cu = Math.cos(u), su = Math.sin(u);
    const x = 16 * su * su * su;
    const y = 13 * cu - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
    const depth = Math.sin(v * 2) * 1.5 + Math.cos(u * 3) * 0.5;
    
    positions.push(new THREE.Vector3(
      x * 0.2 * HEART_SCALE / 3.5,
      (y * 0.2 + 0.3) * HEART_SCALE / 3.5,
      depth * 0.4
    ));
  }
  return positions;
}

// ============================================================
// PHOTO TEXTURES
// ============================================================
function createPhotoTexture(index) {
  const loader = new THREE.TextureLoader();
  
  const possiblePaths = [
    `photos/${index + 1}.jpg`,
    `photos/${index + 1}.png`,
    `photos/${index + 1}.jpeg`,
    `photos/photo_${index + 1}.jpg`,
    `photos/IMG_${String(index + 1).padStart(4, '0')}.jpg`,
  ];
  
  // 创建占位符
  const cvs = document.createElement('canvas');
  cvs.width = 256; cvs.height = 256;
  const ctx = cvs.getContext('2d');
  
  const hue1 = (index * 37 + 300) % 360;
  const hue2 = (hue1 + 40) % 360;
  const grad = ctx.createLinearGradient(0, 0, 256, 256);
  grad.addColorStop(0, `hsl(${hue1}, 60%, 55%)`);
  grad.addColorStop(1, `hsl(${hue2}, 70%, 45%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 48px Georgia';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${index + 1}`, 128, 120);
  ctx.font = '28px serif';
  ctx.fillText('💖', 128, 180);
  
  const fallbackTexture = new THREE.CanvasTexture(cvs);
  fallbackTexture.colorSpace = THREE.SRGBColorSpace;
  
  // 尝试加载真实图片
  for (const path of possiblePaths) {
    try {
      loader.load(path, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        const photo = photos[index];
        if (photo && photo.mesh.children[1]) {
          photo.mesh.children[1].material.map = tex;
          photo.mesh.children[1].material.needsUpdate = true;
        }
      }, undefined, () => {});
      return fallbackTexture;
    } catch (e) { continue; }
  }
  
  return fallbackTexture;
}

// ============================================================
// CREATE PHOTO MESHES
// ============================================================
const photoGroup = new THREE.Group();
scene.add(photoGroup);

const photos = [];
const heartPositions = generateHeartPositions(PHOTO_COUNT);

const frameGeometry = new THREE.BoxGeometry(1.15, 1.15, 0.06);
const frameMaterial = new THREE.MeshStandardMaterial({
  color: ROSE_GOLD, metalness: 0.92, roughness: 0.15
});

const photoGeometry = new THREE.PlaneGeometry(1.0, 1.0);

for (let i = 0; i < PHOTO_COUNT; i++) {
  const group = new THREE.Group();
  
  const frame = new THREE.Mesh(frameGeometry, frameMaterial.clone());
  group.add(frame);
  
  const photoMat = new THREE.MeshStandardMaterial({
    map: createPhotoTexture(i), metalness: 0.05, roughness: 0.4
  });
  const photoMesh = new THREE.Mesh(photoGeometry, photoMat);
  photoMesh.position.z = 0.035;
  group.add(photoMesh);
  
  const backMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.3, roughness: 0.7 });
  const backMesh = new THREE.Mesh(photoGeometry, backMat);
  backMesh.position.z = -0.035;
  backMesh.rotation.y = Math.PI;
  group.add(backMesh);
  
  const pos = heartPositions[i];
  group.position.copy(pos);
  group.lookAt(pos.clone().multiplyScalar(2).add(new THREE.Vector3(0, 0, 2)));
  
  photos.push({
    mesh: group,
    heartPos: pos.clone(),
    heartQuat: group.quaternion.clone(),
    explodedPos: new THREE.Vector3(),
    explodedQuat: new THREE.Quaternion(),
    velocity: new THREE.Vector3(),
    angularVel: new THREE.Vector3(),
    floatOffset: Math.random() * Math.PI * 2,
    floatSpeed: 0.3 + Math.random() * 0.5,
    floatAmplitude: 0.02 + Math.random() * 0.03,
  });
  
  photoGroup.add(group);
}

// ============================================================
// PARTICLES
// ============================================================
const particleGeom = new THREE.BufferGeometry();
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleSizes = new Float32Array(PARTICLE_COUNT);
const particleColors = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 4 + Math.random() * 12;
  
  particlePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
  particlePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  particlePositions[i*3+2] = r * Math.cos(phi);
  
  particleSizes[i] = Math.random() * 3 + 0.5;
  
  const c = Math.random();
  if (c < 0.5) { particleColors[i*3] = 1; particleColors[i*3+1] = 1; particleColors[i*3+2] = 1; }
  else if (c < 0.8) { particleColors[i*3] = 1; particleColors[i*3+1] = 0.7; particleColors[i*3+2] = 0.8; }
  else { particleColors[i*3] = 1; particleColors[i*3+1] = 0.85; particleColors[i*3+2] = 0.4; }
}

particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeom.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
particleGeom.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

const particleMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uTime;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float twinkle = sin(uTime * 2.0 + position.x * 3.0 + position.y * 5.0) * 0.5 + 0.5;
      vAlpha = 0.3 + twinkle * 0.7;
      gl_PointSize = size * uPixelRatio * (80.0 / -mvPos.z) * (0.5 + twinkle * 0.5);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.0, d) * vAlpha;
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(particleGeom, particleMat);
scene.add(particles);

// ============================================================
// CORE GLOW
// ============================================================
const glowGeom = new THREE.SphereGeometry(0.5, 32, 32);
const glowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor1: { value: new THREE.Color(0xff69b4) },
    uColor2: { value: new THREE.Color(0xffd700) }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vViewPos;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vViewPos = mvPos.xyz;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    varying vec3 vNormal;
    varying vec3 vViewPos;
    void main() {
      float fresnel = pow(1.0 - abs(dot(normalize(vViewPos), vNormal)), 2.0);
      float pulse = sin(uTime * 3.0) * 0.3 + 0.7;
      vec3 color = mix(uColor1, uColor2, sin(uTime * 1.5) * 0.5 + 0.5);
      gl_FragColor = vec4(color, fresnel * pulse * 0.8);
    }
  `,
  transparent: true, depthWrite: false, side: THREE.FrontSide, blending: THREE.AdditiveBlending
});
const coreGlow = new THREE.Mesh(glowGeom, glowMat);
scene.add(coreGlow);

// ============================================================
// STATE
// ============================================================
let state = 'heart';
let explosionProgress = 0;
let targetExplosion = 0;
let gestureState = 'none';
let handPosition = { x: 0, y: 0 };
let cameraTarget = { x: 0, y: 0 };
let clock = new THREE.Clock();
let mediaPipeReady = false;

// ============================================================
// EXPLOSION LOGIC
// ============================================================
function triggerExplosion() {
  if (state === 'exploding') return;
  state = 'exploding';
  targetExplosion = 1;
  
  photos.forEach((p) => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = EXPLOSION_RADIUS * (0.5 + Math.random() * 0.5);
    
    p.explodedPos.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi) * 0.5
    );
    
    p.explodedQuat.setFromEuler(new THREE.Euler(
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2
    ));
    
    p.angularVel.set(
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02
    );
    
    const dir = p.explodedPos.clone().normalize();
    p.velocity.copy(dir).multiplyScalar(0.3 + Math.random() * 0.2);
  });
}

function triggerContraction() {
  if (state === 'contracting') return;
  state = 'contracting';
  targetExplosion = 0;
  photos.forEach(p => { p.velocity.set(0, 0, 0); p.angularVel.set(0, 0, 0); });
}

// ============================================================
// INTERACTION - 立即显示页面，手势后台加载
// ============================================================

// 1. 立即显示页面
setTimeout(() => {
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
}, 500);

// 2. 设置触摸/鼠标备用交互
function setupTouchFallback() {
  let lastTap = 0;
  
  canvas.addEventListener('touchstart', (e) => {
    const now = Date.now();
    if (now - lastTap < 300) {
      if (state === 'exploded' || state === 'exploding') triggerContraction();
    } else {
      if (state === 'heart' || state === 'contracting') triggerExplosion();
    }
    lastTap = now;
  });
  
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
      handPosition.x = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
      handPosition.y = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
    }
  });
  
  canvas.addEventListener('click', () => {
    if (state === 'heart' || state === 'contracting') triggerExplosion();
  });
  canvas.addEventListener('dblclick', () => {
    if (state === 'exploded' || state === 'exploding') triggerContraction();
  });
  canvas.addEventListener('mousemove', (e) => {
    handPosition.x = (e.clientX / window.innerWidth - 0.5) * 2;
    handPosition.y = (e.clientY / window.innerHeight - 0.5) * 2;
  });
}
setupTouchFallback();

// 3. 延迟加载 MediaPipe（让页面先渲染）
setTimeout(() => initMediaPipe(), 1000);

async function initMediaPipe() {
  const video = document.getElementById('videoFeed');
  const indicator = document.getElementById('gestureIndicator');
  const hint = document.getElementById('hint');
  
  indicator.textContent = '📷 请求摄像头...';
  
  // 请求摄像头
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: 320, height: 240, facingMode: 'user' } 
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    indicator.textContent = '👆 点击=爆炸 | 双击=聚合';
    video.style.display = 'none';
    hint.textContent = '摄像头权限被拒绝，使用触摸交互';
    return;
  }
  
  indicator.textContent = '⏳ 加载手势模型...';
  hint.textContent = '首次加载约需10-30秒，请耐心等待';
  
  try {
    // 并行加载
    const [handsModule, cameraModule] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js'),
      import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js')
    ]);
    
    const { Hands } = handsModule;
    const { Camera } = cameraModule;
    
    indicator.textContent = '⏳ 初始化中...';
    
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
    });
    
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0, // 轻量模型
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    
    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        
        handPosition.x = -(lm[0].x - 0.5) * 2.5;
        handPosition.y = -(lm[0].y - 0.5) * 2.5;
        
        // 手势检测
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];
        let extended = 0;
        
        for (let i = 0; i < tips.length; i++) {
          if (lm[tips[i]].y < lm[pips[i]].y - 0.04) extended++;
        }
        if (Math.abs(lm[4].x - lm[3].x) > 0.06) extended++;
        
        if (extended >= 4) {
          gestureState = 'open';
          indicator.className = 'open';
          indicator.textContent = '🖐️ 张开手 - 爆炸!';
          if (state === 'heart' || state === 'contracting') triggerExplosion();
        } else if (extended <= 1) {
          gestureState = 'fist';
          indicator.className = 'fist';
          indicator.textContent = '✊ 握拳 - 聚合!';
          if (state === 'exploded' || state === 'exploding') triggerContraction();
        } else {
          indicator.className = '';
          indicator.textContent = '✋ 张开手 → 爆炸 | ✊ 握拳 → 聚合';
        }
      } else {
        if (mediaPipeReady) {
          indicator.className = '';
          indicator.textContent = '✋ 张开手 → 爆炸 | ✊ 握拳 → 聚合';
        }
      }
    });
    
    const cam = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 320, height: 240
    });
    await cam.start();
    
    mediaPipeReady = true;
    indicator.textContent = '✋ 张开手 → 爆炸 | ✊ 握拳 → 聚合';
    hint.textContent = '手势识别已就绪 ✨';
    setTimeout(() => hint.style.display = 'none', 3000);
    
  } catch (e) {
    console.error('MediaPipe failed:', e);
    indicator.textContent = '👆 点击=爆炸 | 双击=聚合';
    video.style.display = 'none';
    hint.textContent = '手势加载失败，使用触摸交互';
  }
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  
  const time = clock.getElapsedTime();
  
  const heartbeat = Math.sin(time * HEARTBEAT_SPEED * Math.PI * 2) * HEARTBEAT_AMPLITUDE;
  const heartbeat2 = Math.sin(time * HEARTBEAT_SPEED * Math.PI * 2 + 0.3) * HEARTBEAT_AMPLITUDE * 0.5;
  const heartbeatScale = 1 + heartbeat + heartbeat2;
  
  explosionProgress += (targetExplosion - explosionProgress) * LERP_SPEED;
  
  if (explosionProgress > 0.95 && targetExplosion === 1) state = 'exploded';
  if (explosionProgress < 0.05 && targetExplosion === 0) state = 'heart';
  
  photos.forEach((p, i) => {
    if (explosionProgress < 0.01) {
      p.mesh.position.copy(p.heartPos);
      p.mesh.quaternion.copy(p.heartQuat);
      p.mesh.scale.setScalar(heartbeatScale);
    } else if (explosionProgress > 0.99) {
      p.mesh.position.add(p.velocity);
      p.velocity.multiplyScalar(0.995);
      p.mesh.rotation.x += p.angularVel.x;
      p.mesh.rotation.y += p.angularVel.y;
      p.mesh.rotation.z += p.angularVel.z;
      p.mesh.position.y += Math.sin(time * p.floatSpeed + p.floatOffset) * p.floatAmplitude;
      p.mesh.position.x += Math.cos(time * p.floatSpeed * 0.7 + p.floatOffset) * p.floatAmplitude * 0.5;
      p.mesh.scale.setScalar(1);
    } else {
      const target = new THREE.Vector3().lerpVectors(p.heartPos, p.explodedPos, explosionProgress);
      p.mesh.position.lerp(target, 0.08);
      p.mesh.quaternion.slerpQuaternions(p.heartQuat, p.explodedQuat, explosionProgress);
      if (explosionProgress > 0.3) {
        p.mesh.rotation.x += p.angularVel.x * explosionProgress;
        p.mesh.rotation.y += p.angularVel.y * explosionProgress;
      }
      p.mesh.scale.setScalar(THREE.MathUtils.lerp(heartbeatScale, 1, explosionProgress));
    }
  });
  
  const coreScale = heartbeatScale * (1 - explosionProgress * 0.8);
  coreGlow.scale.setScalar(coreScale * 1.5);
  coreGlow.material.uniforms.uTime.value = time;
  
  coreLight.intensity = 3 * heartbeatScale * (1 - explosionProgress * 0.5);
  coreLight2.intensity = 1.5 * heartbeatScale * (1 - explosionProgress * 0.5);
  
  particleMat.uniforms.uTime.value = time;
  particles.rotation.y = time * 0.02;
  
  cameraTarget.x += (handPosition.x * 3 - cameraTarget.x) * 0.03;
  cameraTarget.y += (-handPosition.y * 2 - cameraTarget.y) * 0.03;
  
  camera.position.x = cameraTarget.x;
  camera.position.y = cameraTarget.y;
  camera.position.z = 12 - explosionProgress * 2;
  camera.lookAt(0, 0, 0);
  
  if (state === 'heart') {
    photoGroup.rotation.y = Math.sin(time * 0.3) * 0.1;
  }
  
  composer.render();
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// START
// ============================================================
animate();

</script>
