<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💖 妙妙七夕快乐 💖</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" as="script">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" as="script">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; font-family: 'Georgia', serif; color: #fff; touch-action: none; }
#canvas3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#videoFeed {
  position: fixed; bottom: 20px; right: 20px; width: 160px; height: 120px;
  border: 2px solid rgba(255,182,193,0.4); border-radius: 12px; z-index: 100;
  transform: scaleX(-1); object-fit: cover; opacity: 0.8;
}
#loading {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a1a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; transition: opacity 0.8s ease;
}
#loading h1 {
  font-size: 2em; background: linear-gradient(135deg, #ffd700, #ff69b4, #ffd700);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px;
}
#loading .spinner {
  width: 40px; height: 40px; border: 3px solid rgba(255,182,193,0.2);
  border-top-color: #ff69b4; border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#gestureStatus {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
  font-size: 14px; padding: 8px 16px; border-radius: 20px; background: rgba(20,10,40,0.8);
  border: 1px solid rgba(255,182,193,0.3); transition: all 0.3s ease;
  pointer-events: none; white-space: nowrap;
}
#gestureStatus.ready { border-color: rgba(100,255,100,0.6); color: #90ee90; }
#gestureStatus.error { border-color: rgba(255,100,100,0.6); color: #ffb0b0; }
@media (max-width: 768px) {
  #videoFeed { width: 120px; height: 90px; bottom: 10px; right: 10px; }
  #loading h1 { font-size: 1.5em; }
  #gestureStatus { font-size: 12px; padding: 6px 12px; bottom: 10px; }
}
</style>
</head>
<body>
<div id="loading"><h1>💖 Loading Memories...</h1><div class="spinner"></div></div>
<canvas id="canvas3d"></canvas>
<video id="videoFeed" autoplay playsinline muted></video>
<div id="gestureStatus">⏳ 正在加载手势...</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============ CONFIG ============
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const PHOTO_COUNT = 34;
const HEART_SCALE = 3.5;
const EXPLOSION_RADIUS = 18;
const LERP_SPEED = 0.025;
const HEARTBEAT_SPEED = 1.2;
const HEARTBEAT_AMPLITUDE = 0.06;
const PARTICLE_COUNT = isMobile ? 1000 : 1500;
const ROSE_GOLD = new THREE.Color(0.95, 0.72, 0.60);
const CLICK_TIME = 200;
const CLICK_DIST = 10;
const ZOOM_MIN = 6;
const ZOOM_MAX = 20;
const PHOTO_SCALE = 2;

// ============ RENDERER ============
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060614);
scene.fog = new THREE.FogExp2(0x060614, 0.025);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomRes = isMobile ? 0.5 : 1;
composer.addPass(new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth * bloomRes, window.innerHeight * bloomRes), 0.8, 0.4, 0.85
));

// ============ LIGHTS ============
scene.add(new THREE.AmbientLight(0x332244, 0.6));
const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
mainLight.position.set(5, 8, 5);
scene.add(mainLight);
scene.add(new THREE.DirectionalLight(0xff69b4, 0.4).translateX(-5).translateY(-3).translateZ(3));
const coreLight = new THREE.PointLight(0xff69b4, 3, 15);
scene.add(coreLight);
const coreLight2 = new THREE.PointLight(0xffd700, 1.5, 10);
scene.add(coreLight2);

// ============ HEART POSITIONS ============
function genHeartPos(n) {
  const pos = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const u = (i / n) * Math.PI * 2, v = (i * ga) % Math.PI;
    const cu = Math.cos(u), su = Math.sin(u);
    const x = 16 * su * su * su;
    const y = 13 * cu - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
    const d = Math.sin(v * 2) * 1.5 + Math.cos(u * 3) * 0.5;
    pos.push(new THREE.Vector3(x * 0.2 * HEART_SCALE / 3.5, (y * 0.2 + 0.3) * HEART_SCALE / 3.5, d * 0.4));
  }
  return pos;
}

// ============ PHOTO TEXTURES ============
const texLoader = new THREE.TextureLoader();
function makePlaceholder(i) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const h1 = (i * 37 + 300) % 360, h2 = (h1 + 40) % 360;
  const g = x.createLinearGradient(0, 0, 256, 256);
  g.addColorStop(0, `hsl(${h1},60%,55%)`); g.addColorStop(1, `hsl(${h2},70%,45%)`);
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  x.fillStyle = 'rgba(255,255,255,0.9)'; x.font = 'bold 48px Georgia';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(`${i+1}`, 128, 120); x.font = '28px serif'; x.fillText('💖', 128, 180);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function loadRealTex(i, mesh) {
  const paths = [`photos/${i+1}.jpg`,`photos/${i+1}.png`,`photos/${i+1}.jpeg`,`photos/photo_${i+1}.jpg`,`photos/IMG_${String(i+1).padStart(4,'0')}.jpg`];
  for (const p of paths) {
    texLoader.load(p, t => { t.colorSpace = THREE.SRGBColorSpace; mesh.material.map = t; mesh.material.needsUpdate = true; }, undefined, () => {});
    return;
  }
}

// ============ CREATE PHOTOS ============
const photoGroup = new THREE.Group();
scene.add(photoGroup);
const photos = [];
const heartPositions = genHeartPos(PHOTO_COUNT);
const frameGeo = new THREE.BoxGeometry(1.15, 1.15, 0.06);
const frameMat = new THREE.MeshStandardMaterial({ color: ROSE_GOLD, metalness: 0.92, roughness: 0.15 });
const photoGeo = new THREE.PlaneGeometry(1.0, 1.0);

for (let i = 0; i < PHOTO_COUNT; i++) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(frameGeo, frameMat.clone()));
  const pm = new THREE.Mesh(photoGeo, new THREE.MeshStandardMaterial({ map: makePlaceholder(i), metalness: 0.05, roughness: 0.4 }));
  pm.position.z = 0.035; g.add(pm);
  const bm = new THREE.Mesh(photoGeo, new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.3, roughness: 0.7 }));
  bm.position.z = -0.035; bm.rotation.y = Math.PI; g.add(bm);
  const pos = heartPositions[i];
  g.position.copy(pos);
  g.lookAt(pos.clone().multiplyScalar(2).add(new THREE.Vector3(0, 0, 2)));
  photos.push({
    mesh: g, photoMesh: pm,
    heartPos: pos.clone(), heartQuat: g.quaternion.clone(),
    explodedPos: new THREE.Vector3(), explodedQuat: new THREE.Quaternion(),
    velocity: new THREE.Vector3(), angularVel: new THREE.Vector3(),
    floatOffset: Math.random() * Math.PI * 2, floatSpeed: 0.3 + Math.random() * 0.5,
    floatAmplitude: 0.02 + Math.random() * 0.03,
    zoomScale: 1,
  });
  photoGroup.add(g);
}
setTimeout(() => photos.forEach((p, i) => setTimeout(() => loadRealTex(i, p.photoMesh), i * 100)), 500);

// ============ PARTICLES ============
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PARTICLE_COUNT * 3), pSiz = new Float32Array(PARTICLE_COUNT), pCol = new Float32Array(PARTICLE_COUNT * 3);
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), r = 4 + Math.random() * 12;
  pPos[i*3] = r * Math.sin(ph) * Math.cos(th); pPos[i*3+1] = r * Math.sin(ph) * Math.sin(th); pPos[i*3+2] = r * Math.cos(ph);
  pSiz[i] = Math.random() * 3 + 0.5;
  const c = Math.random();
  if (c < 0.5) { pCol[i*3]=1;pCol[i*3+1]=1;pCol[i*3+2]=1; }
  else if (c < 0.8) { pCol[i*3]=1;pCol[i*3+1]=0.7;pCol[i*3+2]=0.8; }
  else { pCol[i*3]=1;pCol[i*3+1]=0.85;pCol[i*3+2]=0.4; }
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSiz, 1));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
  vertexShader: `attribute float size; attribute vec3 color; varying vec3 vC; varying float vA;
    uniform float uTime; uniform float uPixelRatio;
    void main() { vC=color; vec4 mv=modelViewMatrix*vec4(position,1.);
    float tw=sin(uTime*2.+position.x*3.+position.y*5.)*.5+.5; vA=.3+tw*.7;
    gl_PointSize=size*uPixelRatio*(80./-mv.z)*(.5+tw*.5); gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `varying vec3 vC; varying float vA;
    void main() { float d=length(gl_PointCoord-.5); if(d>.5)discard;
    gl_FragColor=vec4(vC,smoothstep(.5,.0,d)*vA); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ============ CORE GLOW ============
const glowMat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0}, uC1:{value:new THREE.Color(0xff69b4)}, uC2:{value:new THREE.Color(0xffd700)} },
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){vN=normalize(normalMatrix*normal);vec4 m=modelViewMatrix*vec4(position,1.);vV=m.xyz;gl_Position=projectionMatrix*m;}`,
  fragmentShader: `uniform float uTime;uniform vec3 uC1,uC2;varying vec3 vN,vV;void main(){float f=pow(1.-abs(dot(normalize(vV),vN)),2.);float p=sin(uTime*3.)*.3+.7;vec3 c=mix(uC1,uC2,sin(uTime*1.5)*.5+.5);gl_FragColor=vec4(c,f*p*.8);}`,
  transparent: true, depthWrite: false, side: THREE.FrontSide, blending: THREE.AdditiveBlending
});
const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), glowMat);
scene.add(coreGlow);

// ============ STATE ============
let state = 'heart', explosionProgress = 0, targetExplosion = 0;
let handPosition = { x: 0, y: 0 }, cameraTarget = { x: 0, y: 0 };
const clock = new THREE.Clock();
let mediaPipeReady = false, frameCount = 0;

// Touch state
const touch = {
  active: false, dragging: false, pinching: false,
  startTime: 0, startPos: {x:0,y:0},
  pinchDist: 0, initZoom: 12, zoom: 12,
  rot: {x:0,y:0}, lastRot: {x:0,y:0},
};

// Raycaster
const raycaster = new THREE.Raycaster();
const mouse2 = new THREE.Vector2();

// ============ EXPLOSION / CONTRACTION ============
function resetZoom() { photos.forEach(p => p.zoomScale = 1); }

function triggerExplosion() {
  if (state === 'exploding') return;
  state = 'exploding'; targetExplosion = 1; resetZoom();
  photos.forEach(p => {
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=EXPLOSION_RADIUS*(.5+Math.random()*.5);
    p.explodedPos.set(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph)*.5);
    p.explodedQuat.setFromEuler(new THREE.Euler(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2));
    p.angularVel.set((Math.random()-.5)*.02, (Math.random()-.5)*.02, (Math.random()-.5)*.02);
    p.velocity.copy(p.explodedPos.clone().normalize()).multiplyScalar(.3+Math.random()*.2);
  });
}
function triggerContraction() {
  if (state === 'contracting') return;
  state = 'contracting'; targetExplosion = 0; resetZoom();
  photos.forEach(p => { p.velocity.set(0,0,0); p.angularVel.set(0,0,0); });
}

// ============ TOUCH INTERACTION ============
function touchDist(t1, t2) { return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY); }

function getPhotoAt(cx, cy) {
  mouse2.x = (cx / window.innerWidth) * 2 - 1;
  mouse2.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse2, camera);
  const meshes = [];
  photos.forEach(p => p.mesh.children.forEach(c => meshes.push(c)));
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const obj = hits[0].object;
    for (const p of photos) { if (p.mesh.children.includes(obj)) return p; }
  }
  return null;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    touch.active = true; touch.dragging = false; touch.pinching = false;
    touch.startTime = Date.now();
    touch.startPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touch.lastRot = { ...touch.rot };
  } else if (e.touches.length === 2) {
    touch.pinching = true; touch.active = false;
    touch.pinchDist = touchDist(e.touches[0], e.touches[1]);
    touch.initZoom = touch.zoom;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (touch.pinching && e.touches.length === 2) {
    const d = touchDist(e.touches[0], e.touches[1]);
    touch.zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, touch.initZoom / (d / touch.pinchDist)));
  } else if (touch.active && e.touches.length === 1) {
    const dx = e.touches[0].clientX - touch.startPos.x;
    const dy = e.touches[0].clientY - touch.startPos.y;
    if (Math.hypot(dx, dy) > CLICK_DIST) {
      touch.dragging = true;
      touch.rot.y = touch.lastRot.y + dx * 0.005;
      touch.rot.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, touch.lastRot.x + dy * 0.005));
      resetZoom();
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (touch.active && !touch.dragging && Date.now() - touch.startTime < CLICK_TIME) {
    const hit = getPhotoAt(touch.startPos.x, touch.startPos.y);
    if (hit) { resetZoom(); hit.zoomScale = PHOTO_SCALE; }
  }
  if (e.touches.length === 0) { touch.active = false; touch.dragging = false; touch.pinching = false; }
  else if (e.touches.length === 1) {
    touch.pinching = false; touch.active = true; touch.startTime = Date.now();
    touch.startPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touch.lastRot = { ...touch.rot };
  }
}, { passive: false });

// ============ MEDIAPIPE ============
setTimeout(() => {
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
}, 500);

initMediaPipeWithRetry();

async function initMediaPipeWithRetry() {
  const s = document.getElementById('gestureStatus');
  let retries = 0;
  const delays = [2000, 5000, 10000];
  async function attempt() {
    try {
      await initMediaPipe();
      s.textContent = '✅ 手势已就绪'; s.className = 'ready';
      setTimeout(() => { s.style.opacity = '0'; setTimeout(() => s.style.display = 'none', 500); }, 3000);
    } catch (e) {
      retries++;
      if (retries <= 3) {
        s.textContent = `⏳ 加载失败，${delays[retries-1]/1000}秒后重试...`;
        setTimeout(attempt, delays[retries-1]);
      } else {
        s.textContent = '❌ 手势加载失败，点击重试'; s.className = 'error';
        s.style.pointerEvents = 'auto';
        s.onclick = () => { retries = 0; s.style.pointerEvents = 'none'; s.onclick = null; attempt(); };
      }
    }
  }
  attempt();
}

async function initMediaPipe() {
  const video = document.getElementById('videoFeed');
  const s = document.getElementById('gestureStatus');
  s.textContent = '📷 请求摄像头权限...';
  const stream = await Promise.race([
    navigator.mediaDevices.getUserMedia({ video: { width: isMobile?240:320, height: isMobile?180:240, facingMode:'user' } }),
    new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 15000))
  ]);
  video.srcObject = stream; await video.play();
  s.textContent = '⏳ 下载手势模型...';
  const [hMod, cMod] = await Promise.all([
    Promise.race([import('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js'), new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 15000))]),
    Promise.race([import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js'), new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 15000))])
  ]);
  const hands = new hMod.Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });
  hands.setOptions({ maxNumHands:1, modelComplexity:0, minDetectionConfidence:.6, minTrackingConfidence:.5 });
  hands.onResults(r => {
    if (r.multiHandLandmarks?.length > 0) {
      const lm = r.multiHandLandmarks[0];
      handPosition.x = -(lm[0].x - .5) * 2.5;
      handPosition.y = -(lm[0].y - .5) * 2.5;
      const tips=[8,12,16,20], pips=[6,10,14,18]; let ext=0;
      for (let i=0;i<4;i++) if(lm[tips[i]].y < lm[pips[i]].y-.04) ext++;
      if(Math.abs(lm[4].x-lm[3].x)>.06) ext++;
      if(ext>=4) { if(state==='heart'||state==='contracting') triggerExplosion(); }
      else if(ext<=1) { if(state==='exploded'||state==='exploding') triggerContraction(); }
    }
  });
  const cam = new cMod.Camera(video, {
    onFrame: async () => { frameCount++; if(isMobile && frameCount%3!==0) return; await hands.send({image:video}); },
    width: isMobile?240:320, height: isMobile?180:240
  });
  await cam.start();
  mediaPipeReady = true;
}

// ============ ANIMATION ============
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const hb = Math.sin(time*HEARTBEAT_SPEED*Math.PI*2)*HEARTBEAT_AMPLITUDE;
  const hb2 = Math.sin(time*HEARTBEAT_SPEED*Math.PI*2+.3)*HEARTBEAT_AMPLITUDE*.5;
  const hbScale = 1 + hb + hb2;

  explosionProgress += (targetExplosion - explosionProgress) * LERP_SPEED;
  if (explosionProgress > .95 && targetExplosion === 1) state = 'exploded';
  if (explosionProgress < .05 && targetExplosion === 0) state = 'heart';

  // Apply heart rotation from touch
  photoGroup.rotation.x = touch.rot.x;
  photoGroup.rotation.y = touch.rot.y;

  photos.forEach(p => {
    const zs = p.zoomScale;
    if (explosionProgress < .01) {
      p.mesh.position.copy(p.heartPos);
      p.mesh.quaternion.copy(p.heartQuat);
      p.mesh.scale.setScalar(hbScale * zs);
    } else if (explosionProgress > .99) {
      p.mesh.position.add(p.velocity); p.velocity.multiplyScalar(.995);
      p.mesh.rotation.x += p.angularVel.x; p.mesh.rotation.y += p.angularVel.y; p.mesh.rotation.z += p.angularVel.z;
      p.mesh.position.y += Math.sin(time*p.floatSpeed+p.floatOffset)*p.floatAmplitude;
      p.mesh.position.x += Math.cos(time*p.floatSpeed*.7+p.floatOffset)*p.floatAmplitude*.5;
      p.mesh.scale.setScalar(zs);
    } else {
      const tgt = new THREE.Vector3().lerpVectors(p.heartPos, p.explodedPos, explosionProgress);
      p.mesh.position.lerp(tgt, .08);
      p.mesh.quaternion.slerpQuaternions(p.heartQuat, p.explodedQuat, explosionProgress);
      if (explosionProgress > .3) { p.mesh.rotation.x+=p.angularVel.x*explosionProgress; p.mesh.rotation.y+=p.angularVel.y*explosionProgress; }
      p.mesh.scale.setScalar(THREE.MathUtils.lerp(hbScale, 1, explosionProgress) * zs);
    }
  });

  const cs = hbScale * (1 - explosionProgress * .8);
  coreGlow.scale.setScalar(cs * 1.5);
  coreGlow.material.uniforms.uTime.value = time;
  coreLight.intensity = 3 * hbScale * (1 - explosionProgress * .5);
  coreLight2.intensity = 1.5 * hbScale * (1 - explosionProgress * .5);
  pMat.uniforms.uTime.value = time;
  particles.rotation.y = time * .02;

  cameraTarget.x += (handPosition.x * 3 - cameraTarget.x) * .03;
  cameraTarget.y += (-handPosition.y * 2 - cameraTarget.y) * .03;
  camera.position.x = cameraTarget.x;
  camera.position.y = cameraTarget.y;
  camera.position.z = touch.zoom - explosionProgress * 2;
  camera.lookAt(0, 0, 0);

  if (state === 'heart') photoGroup.rotation.y += Math.sin(time * .3) * .002;

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
