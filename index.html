<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 纪念日互动相册</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #0a0a1a;
  font-family: 'Georgia', serif;
  color: #fff;
}
#canvas3d {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
#videoFeed {
  position: fixed;
  bottom: 20px; right: 20px;
  width: 200px; height: 150px;
  border: 2px solid rgba(255,182,193,0.4);
  border-radius: 12px;
  z-index: 100;
  transform: scaleX(-1);
  object-fit: cover;
  opacity: 0.8;
}
#gestureIndicator {
  position: fixed;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 18px;
  padding: 10px 24px;
  border-radius: 30px;
  background: rgba(20,10,40,0.7);
  border: 1px solid rgba(255,182,193,0.3);
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  pointer-events: none;
}
#gestureIndicator.open { border-color: rgba(255,215,0,0.8); color: #ffd700; }
#gestureIndicator.fist { border-color: rgba(255,105,180,0.8); color: #ff69b4; }
#loading {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 1s ease;
}
#loading h1 {
  font-size: 2.5em;
  background: linear-gradient(135deg, #ffd700, #ff69b4, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}
#loading .spinner {
  width: 50px; height: 50px;
  border: 3px solid rgba(255,182,193,0.2);
  border-top-color: #ff69b4;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#hint {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  pointer-events: none;
}
</style>
</head>
<body>

<div id="loading">
  <h1>💖 Loading Memories...</h1>
  <div class="spinner"></div>
</div>

<canvas id="canvas3d"></canvas>
<video id="videoFeed" autoplay playsinline></video>
<div id="gestureIndicator">✋ 张开手 → 爆炸 | ✊ 握拳 → 聚合</div>
<div id="hint">请允许摄像头权限以启用手势控制</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================
// CONFIG
// ============================================================
const PHOTO_COUNT = 34;
const HEART_SCALE = 3.5;
const EXPLOSION_RADIUS = 18;
const LERP_SPEED = 0.025;
const HEARTBEAT_SPEED = 1.2;
const HEARTBEAT_AMPLITUDE = 0.06;
const PARTICLE_COUNT = 2000;
const ROSE_GOLD = new THREE.Color(0.95, 0.72, 0.60);
const ROSE_GOLD_DARK = new THREE.Color(0.72, 0.45, 0.38);

// ============================================================
// SCENE SETUP
// ============================================================
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060614);
scene.fog = new THREE.FogExp2(0x060614, 0.025);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85
);
composer.addPass(bloomPass);

// ============================================================
// LIGHTING
// ============================================================
const ambientLight = new THREE.AmbientLight(0x332244, 0.6);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
mainLight.position.set(5, 8, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0xff69b4, 0.4);
fillLight.position.set(-5, -3, 3);
scene.add(fillLight);

// Core pulse light
const coreLight = new THREE.PointLight(0xff69b4, 3, 15);
coreLight.position.set(0, 0, 0);
scene.add(coreLight);

const coreLight2 = new THREE.PointLight(0xffd700, 1.5, 10);
coreLight2.position.set(0, 0, 0);
scene.add(coreLight2);

// ============================================================
// HEART SHAPE GENERATION (3D parametric surface)
// ============================================================
function heartPosition(u, v) {
  // Parametric heart surface
  const cu = Math.cos(u), su = Math.sin(u);
  const cv = Math.cos(v), sv = Math.sin(v);
  
  const x = 16 * su * su * su;
  const y = 13 * cu - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
  const z = (su * su) * sv * 4;
  
  return new THREE.Vector3(
    x * 0.22,
    y * 0.22 + 0.5,
    z * 0.35
  ).multiplyScalar(HEART_SCALE / 3.5);
}

function generateHeartPositions(count) {
  const positions = [];
  // Fibonacci sphere distribution mapped to heart surface
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const u = t * Math.PI * 2;
    const v = (i * goldenAngle) % Math.PI;
    
    // Map to heart surface with some variation
    const cu = Math.cos(u), su = Math.sin(u);
    const x = 16 * su * su * su;
    const y = 13 * cu - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
    
    // Add depth variation
    const depth = Math.sin(v * 2) * 1.5 + Math.cos(u * 3) * 0.5;
    
    positions.push(new THREE.Vector3(
      x * 0.2 * HEART_SCALE / 3.5,
      (y * 0.2 + 0.3) * HEART_SCALE / 3.5,
      depth * 0.4
    ));
  }
  return positions;
}

// ============================================================
// PHOTO TEXTURES
// ============================================================
function createPhotoTexture(index) {
  // 尝试加载 photos/ 文件夹中的图片
  // 支持的文件名: 1.jpg, 2.jpg, 3.jpg ... 或 photo_1.jpg, photo_2.jpg ...
  const loader = new THREE.TextureLoader();
  
  const possiblePaths = [
    `photos/${index + 1}.jpg`,
    `photos/${index + 1}.png`,
    `photos/${index + 1}.jpeg`,
    `photos/photo_${index + 1}.jpg`,
    `photos/photo_${index + 1}.png`,
    `photos/IMG_${String(index + 1).padStart(4, '0')}.jpg`,
    `photos/IMG_${String(index + 1).padStart(4, '0')}.jpeg`,
  ];
  
  // 创建占位符作为后备
  const cvs = document.createElement('canvas');
  cvs.width = 256;
  cvs.height = 256;
  const ctx = cvs.getContext('2d');
  
  const hue1 = (index * 37 + 300) % 360;
  const hue2 = (hue1 + 40) % 360;
  const grad = ctx.createLinearGradient(0, 0, 256, 256);
  grad.addColorStop(0, `hsl(${hue1}, 60%, 55%)`);
  grad.addColorStop(1, `hsl(${hue2}, 70%, 45%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 48px Georgia';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${index + 1}`, 128, 120);
  ctx.font = '28px serif';
  ctx.fillText('💖', 128, 180);
  
  const fallbackTexture = new THREE.CanvasTexture(cvs);
  fallbackTexture.colorSpace = THREE.SRGBColorSpace;
  
  // 尝试加载真实图片，失败则使用占位符
  for (const path of possiblePaths) {
    try {
      const texture = loader.load(
        path,
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          // 更新材质
          const photo = photos[index];
          if (photo && photo.mesh.children[1]) {
            photo.mesh.children[1].material.map = tex;
            photo.mesh.children[1].material.needsUpdate = true;
          }
        },
        undefined,
        () => {} // 加载失败，静默处理
      );
      return texture; // 先返回占位符，加载成功后会自动替换
    } catch (e) {
      continue;
    }
  }
  
  return fallbackTexture;
}

// ============================================================
// CREATE PHOTO MESHES WITH ROSE GOLD FRAMES
// ============================================================
const photoGroup = new THREE.Group();
scene.add(photoGroup);

const photos = [];
const heartPositions = generateHeartPositions(PHOTO_COUNT);

// Frame geometry (rose gold border)
const frameGeometry = new THREE.BoxGeometry(1.15, 1.15, 0.06);
const frameMaterial = new THREE.MeshStandardMaterial({
  color: ROSE_GOLD,
  metalness: 0.92,
  roughness: 0.15,
  envMapIntensity: 1.5
});

// Photo face geometry
const photoGeometry = new THREE.PlaneGeometry(1.0, 1.0);

for (let i = 0; i < PHOTO_COUNT; i++) {
  const group = new THREE.Group();
  
  // Frame
  const frame = new THREE.Mesh(frameGeometry, frameMaterial.clone());
  group.add(frame);
  
  // Photo face
  const photoMat = new THREE.MeshStandardMaterial({
    map: createPhotoTexture(i),
    metalness: 0.05,
    roughness: 0.4,
  });
  const photoMesh = new THREE.Mesh(photoGeometry, photoMat);
  photoMesh.position.z = 0.035;
  group.add(photoMesh);
  
  // Back side
  const backMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e,
    metalness: 0.3,
    roughness: 0.7
  });
  const backMesh = new THREE.Mesh(photoGeometry, backMat);
  backMesh.position.z = -0.035;
  backMesh.rotation.y = Math.PI;
  group.add(backMesh);
  
  // Position on heart
  const pos = heartPositions[i];
  group.position.copy(pos);
  
  // Face outward from heart center
  group.lookAt(pos.clone().multiplyScalar(2).add(new THREE.Vector3(0, 0, 2)));
  
  // Store animation data
  const photoData = {
    mesh: group,
    heartPos: pos.clone(),
    heartQuat: group.quaternion.clone(),
    explodedPos: new THREE.Vector3(),
    explodedQuat: new THREE.Quaternion(),
    currentPos: pos.clone(),
    currentQuat: group.quaternion.clone(),
    velocity: new THREE.Vector3(),
    angularVel: new THREE.Vector3(),
    floatOffset: Math.random() * Math.PI * 2,
    floatSpeed: 0.3 + Math.random() * 0.5,
    floatAmplitude: 0.02 + Math.random() * 0.03,
  };
  
  photos.push(photoData);
  photoGroup.add(group);
}

// ============================================================
// STAR PARTICLE SYSTEM
// ============================================================
const particleGeom = new THREE.BufferGeometry();
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleSizes = new Float32Array(PARTICLE_COUNT);
const particleColors = new Float32Array(PARTICLE_COUNT * 3);
const particlePhases = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 4 + Math.random() * 12;
  
  particlePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
  particlePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  particlePositions[i*3+2] = r * Math.cos(phi);
  
  particleSizes[i] = Math.random() * 3 + 0.5;
  particlePhases[i] = Math.random() * Math.PI * 2;
  
  // Mix of white, pink, and gold particles
  const colorChoice = Math.random();
  if (colorChoice < 0.5) {
    particleColors[i*3] = 1; particleColors[i*3+1] = 1; particleColors[i*3+2] = 1;
  } else if (colorChoice < 0.8) {
    particleColors[i*3] = 1; particleColors[i*3+1] = 0.7; particleColors[i*3+2] = 0.8;
  } else {
    particleColors[i*3] = 1; particleColors[i*3+1] = 0.85; particleColors[i*3+2] = 0.4;
  }
}

particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeom.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
particleGeom.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

const particleMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uTime;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float twinkle = sin(uTime * 2.0 + position.x * 3.0 + position.y * 5.0) * 0.5 + 0.5;
      vAlpha = 0.3 + twinkle * 0.7;
      gl_PointSize = size * uPixelRatio * (80.0 / -mvPos.z) * (0.5 + twinkle * 0.5);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.0, d) * vAlpha;
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(particleGeom, particleMat);
scene.add(particles);

// ============================================================
// CORE GLOW (center energy)
// ============================================================
const glowGeom = new THREE.SphereGeometry(0.5, 32, 32);
const glowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor1: { value: new THREE.Color(0xff69b4) },
    uColor2: { value: new THREE.Color(0xffd700) }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vViewPos;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vViewPos = mvPos.xyz;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    varying vec3 vNormal;
    varying vec3 vViewPos;
    void main() {
      float fresnel = pow(1.0 - abs(dot(normalize(vViewPos), vNormal)), 2.0);
      float pulse = sin(uTime * 3.0) * 0.3 + 0.7;
      vec3 color = mix(uColor1, uColor2, sin(uTime * 1.5) * 0.5 + 0.5);
      gl_FragColor = vec4(color, fresnel * pulse * 0.8);
    }
  `,
  transparent: true,
  depthWrite: false,
  side: THREE.FrontSide,
  blending: THREE.AdditiveBlending
});
const coreGlow = new THREE.Mesh(glowGeom, glowMat);
scene.add(coreGlow);

// ============================================================
// STATE MANAGEMENT
// ============================================================
let state = 'heart'; // 'heart' | 'exploding' | 'exploded' | 'contracting'
let explosionProgress = 0; // 0 = heart, 1 = fully exploded
let targetExplosion = 0;
let gestureState = 'none'; // 'none' | 'open' | 'fist'
let handPosition = { x: 0, y: 0 };
let cameraTarget = { x: 0, y: 0 };
let clock = new THREE.Clock();

// ============================================================
// EXPLOSION LOGIC
// ============================================================
function triggerExplosion() {
  if (state === 'exploding') return;
  state = 'exploding';
  targetExplosion = 1;
  
  photos.forEach((p, i) => {
    // Random spherical direction - different every time!
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = EXPLOSION_RADIUS * (0.5 + Math.random() * 0.5);
    
    p.explodedPos.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi) * 0.5 // flatten z slightly
    );
    
    // Random rotation
    p.explodedQuat.setFromEuler(new THREE.Euler(
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2
    ));
    
    // Random angular velocity for tumbling
    p.angularVel.set(
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02
    );
    
    // Initial velocity burst
    const dir = p.explodedPos.clone().normalize();
    p.velocity.copy(dir).multiplyScalar(0.3 + Math.random() * 0.2);
  });
}

function triggerContraction() {
  if (state === 'contracting') return;
  state = 'contracting';
  targetExplosion = 0;
  
  photos.forEach(p => {
    p.velocity.set(0, 0, 0);
    p.angularVel.set(0, 0, 0);
  });
}

// ============================================================
// MEDIAPIPE HAND TRACKING
// ============================================================
async function initMediaPipe() {
  const video = document.getElementById('videoFeed');
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: 320, height: 240, facingMode: 'user' } 
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    console.warn('Camera not available, using mouse fallback');
    initMouseFallback();
    return;
  }
  
  // Load MediaPipe
  const { Hands } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js');
  const { drawConnectors, drawLandmarks } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js');
  const { camera: CameraLib } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js');
  
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
  });
  
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5
  });
  
  hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const landmarks = results.multiHandLandmarks[0];
      
      // Hand center position (normalized)
      const wrist = landmarks[0];
      const middleTip = landmarks[12];
      handPosition.x = -(wrist.x - 0.5) * 2; // mirror
      handPosition.y = -(wrist.y - 0.5) * 2;
      
      // Gesture detection
      const fingerTips = [8, 12, 16, 20]; // index, middle, ring, pinky tips
      const fingerPIPs = [6, 10, 14, 18];
      let extendedFingers = 0;
      
      for (let i = 0; i < fingerTips.length; i++) {
        const tip = landmarks[fingerTips[i]];
        const pip = landmarks[fingerPIPs[i]];
        if (tip.y < pip.y - 0.03) extendedFingers++;
      }
      
      // Thumb
      const thumbTip = landmarks[4];
      const thumbIP = landmarks[3];
      if (Math.abs(thumbTip.x - thumbIP.x) > 0.05) extendedFingers++;
      
      const indicator = document.getElementById('gestureIndicator');
      
      if (extendedFingers >= 4) {
        gestureState = 'open';
        indicator.className = 'open';
        indicator.textContent = '🖐️ 张开手 - 爆炸!';
        if (state === 'heart' || state === 'contracting') {
          triggerExplosion();
        }
      } else if (extendedFingers <= 1) {
        gestureState = 'fist';
        indicator.className = 'fist';
        indicator.textContent = '✊ 握拳 - 聚合!';
        if (state === 'exploded' || state === 'exploding') {
          triggerContraction();
        }
      } else {
        gestureState = 'none';
        indicator.className = '';
        indicator.textContent = '✋ 张开手 → 爆炸 | ✊ 握拳 → 聚合';
      }
    } else {
      gestureState = 'none';
    }
  });
  
  const cam = new CameraLib(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 320,
    height: 240
  });
  cam.start();
  
  // Hide loading
  setTimeout(() => {
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
  }, 2000);
}

// Mouse fallback for when camera isn't available
function initMouseFallback() {
  document.getElementById('gestureIndicator').textContent = '🖱️ 点击 = 爆炸 | 双击 = 聚合 | 鼠标移动 = 视角';
  
  canvas.addEventListener('click', () => {
    if (state === 'heart' || state === 'contracting') triggerExplosion();
  });
  canvas.addEventListener('dblclick', () => {
    if (state === 'exploded' || state === 'exploding') triggerContraction();
  });
  canvas.addEventListener('mousemove', (e) => {
    handPosition.x = (e.clientX / window.innerWidth - 0.5) * 2;
    handPosition.y = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  
  setTimeout(() => {
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
  }, 1500);
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  
  const time = clock.getElapsedTime();
  const delta = clock.getDelta();
  
  // Heartbeat
  const heartbeat = Math.sin(time * HEARTBEAT_SPEED * Math.PI * 2) * HEARTBEAT_AMPLITUDE;
  const heartbeat2 = Math.sin(time * HEARTBEAT_SPEED * Math.PI * 2 + 0.3) * HEARTBEAT_AMPLITUDE * 0.5;
  const heartbeatScale = 1 + heartbeat + heartbeat2;
  
  // Smooth explosion transition
  explosionProgress += (targetExplosion - explosionProgress) * LERP_SPEED;
  
  if (explosionProgress > 0.95 && targetExplosion === 1) state = 'exploded';
  if (explosionProgress < 0.05 && targetExplosion === 0) state = 'heart';
  
  // Update photos
  photos.forEach((p, i) => {
    if (explosionProgress < 0.01) {
      // Heart formation mode
      p.mesh.position.copy(p.heartPos);
      p.mesh.quaternion.copy(p.heartQuat);
      
      // Apply heartbeat scale
      p.mesh.scale.setScalar(heartbeatScale);
    } else if (explosionProgress > 0.99) {
      // Fully exploded - floating & tumbling
      p.mesh.position.add(p.velocity);
      
      // Dampen velocity
      p.velocity.multiplyScalar(0.995);
      
      // Tumbling rotation
      p.mesh.rotation.x += p.angularVel.x;
      p.mesh.rotation.y += p.angularVel.y;
      p.mesh.rotation.z += p.angularVel.z;
      
      // Gentle floating
      const floatY = Math.sin(time * p.floatSpeed + p.floatOffset) * p.floatAmplitude;
      const floatX = Math.cos(time * p.floatSpeed * 0.7 + p.floatOffset) * p.floatAmplitude * 0.5;
      p.mesh.position.y += floatY;
      p.mesh.position.x += floatX;
      
      p.mesh.scale.setScalar(1);
    } else {
      // Transitioning - lerp between states
      const target = new THREE.Vector3().lerpVectors(p.heartPos, p.explodedPos, explosionProgress);
      p.mesh.position.lerp(target, 0.08);
      
      // Slerp quaternion
      p.mesh.quaternion.slerpQuaternions(p.heartQuat, p.explodedQuat, explosionProgress);
      
      // Add some spin during transition
      if (explosionProgress > 0.3) {
        p.mesh.rotation.x += p.angularVel.x * explosionProgress;
        p.mesh.rotation.y += p.angularVel.y * explosionProgress;
      }
      
      p.mesh.scale.setScalar(THREE.MathUtils.lerp(heartbeatScale, 1, explosionProgress));
    }
  });
  
  // Core glow pulse
  const coreScale = heartbeatScale * (1 - explosionProgress * 0.8);
  coreGlow.scale.setScalar(coreScale * 1.5);
  coreGlow.material.uniforms.uTime.value = time;
  
  // Core light pulse
  coreLight.intensity = 3 * heartbeatScale * (1 - explosionProgress * 0.5);
  coreLight2.intensity = 1.5 * heartbeatScale * (1 - explosionProgress * 0.5);
  
  // Particles
  particleMat.uniforms.uTime.value = time;
  particles.rotation.y = time * 0.02;
  particles.rotation.x = Math.sin(time * 0.1) * 0.05;
  
  // Camera parallax from hand position
  cameraTarget.x += (handPosition.x * 3 - cameraTarget.x) * 0.03;
  cameraTarget.y += (-handPosition.y * 2 - cameraTarget.y) * 0.03;
  
  camera.position.x = cameraTarget.x;
  camera.position.y = cameraTarget.y;
  camera.position.z = 12 - explosionProgress * 2; // zoom out slightly when exploded
  camera.lookAt(0, 0, 0);
  
  // Heart group subtle rotation
  if (state === 'heart') {
    photoGroup.rotation.y = Math.sin(time * 0.3) * 0.1;
  }
  
  // Render
  composer.render();
}

// ============================================================
// RESIZE HANDLER
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// INIT
// ============================================================
initMediaPipe();
animate();

</script>
</body>
