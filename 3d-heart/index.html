<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>七夕快乐</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050510; 
            touch-action: none; 
        }
        canvas { display: block; }
        .input_video { display: none; } 
        #loading { 
            position: absolute; 
            color: #ffffff; 
            top: 50%; 
            width: 100%; 
            text-align: center; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">正在开启魔法(请允许使用摄像头)...</div>
    <video class="input_video" autoplay playsinline></video>

    <script type="module">
        // ==========================================
        // 1. 全局配置与 Three.js 初始化
        // ==========================================
        // 【修改点】减少照片数量，避免过度拥挤
        const PHOTO_COUNT = 45; 
        let currentState = 'heart'; 
        const clock = new THREE.Clock();
        let photos = [];
        let targetCameraPos = new THREE.Vector2(0, 0);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 【修改点】镜头拉远，能看到更震撼的完整大爱心
        camera.position.z = 35; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding; 
        document.body.appendChild(renderer.domElement);

        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // ==========================================
        // 2. 宏大的背景粒子爱心轮廓
        // ==========================================
        // 【修改点】粒子数量大增，勾勒明显的外围轮廓
        const particleCount = 1500; 
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        
        for(let i = 0; i < particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            
            // 【修改点】80%的粒子构成一个巨大的外圈，20%散落内部
            const scale = Math.random() > 0.2 ? 0.35 : Math.random() * 0.35; 
            
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
            
            // 让线条有一点蓬松的星尘感
            const noiseX = (Math.random() - 0.5) * 1.5;
            const noiseY = (Math.random() - 0.5) * 1.5;
            
            particlePositions[i*3] = x + noiseX;
            particlePositions[i*3+1] = y + 1 + noiseY;
            // 把粒子往后推，作为照片的背景
            particlePositions[i*3+2] = -6 - Math.random() * 4; 
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        heartGroup.add(particles); 

        // ==========================================
        // 3. 读取你的照片
        // ==========================================
        const textureLoader = new THREE.TextureLoader();
        
        // 假设你还是准备了 10 张照片（如果是其他数量自己改）
        const YOUR_PHOTO_AMOUNT = 10; 
        const myPhotos = [];
        for (let i = 1; i <= YOUR_PHOTO_AMOUNT; i++) {
            myPhotos.push(textureLoader.load(`./${i}.jpg`));
        }

        // ==========================================
        // 4. 构建错落有致的拍立得照片墙
        // ==========================================
        const whiteBorderMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        // 【修改点】单张照片稍微放大，因为数量减少了
        const photoGeometry = new THREE.PlaneGeometry(1.4, 1.75); 
        const borderGeometry = new THREE.PlaneGeometry(1.5, 1.85); 

        function getHeartPosition() {
            const t = Math.random() * Math.PI * 2;
            
            // 【修改点】大幅度增加照片的散布范围 (multiplier由 0.16 增加到 0.22)
            // 并且刻意让更多照片分布在边缘，避免全挤在最中间
            const r = Math.random();
            const scale = (r > 0.4 ? (0.6 + Math.random()*0.4) : Math.random() * 0.6) * 0.22;
            
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
            
            // 【修改点】大幅增加Z轴的前后错落感，从-2到+2，让相片真正具有3D悬浮感
            const z = (Math.random() - 0.5) * 4; 
            
            return new THREE.Vector3(x, y + 1, z); 
        }

        for (let i = 0; i < PHOTO_COUNT; i++) {
            const group = new THREE.Group();
            
            const currentTex = myPhotos[i % myPhotos.length];
            const photoMat = new THREE.MeshBasicMaterial({ map: currentTex });
            const photoMesh = new THREE.Mesh(photoGeometry, photoMat);
            photoMesh.position.z = 0.01; 

            const borderMesh = new THREE.Mesh(borderGeometry, whiteBorderMaterial);

            group.add(borderMesh);
            group.add(photoMesh);

            const hPos = getHeartPosition();
            const hRot = new THREE.Euler(0, 0, (Math.random() - 0.5) * 1.0); 

            group.userData = {
                heartPos: hPos,
                heartRot: hRot,
                explodedPos: new THREE.Vector3(),
                explodedRot: new THREE.Euler(),
                randomOffset: Math.random() * Math.PI * 2
            };

            group.position.copy(group.userData.heartPos);
            group.rotation.copy(group.userData.heartRot);

            photos.push(group);
            heartGroup.add(group);
        }

        // ==========================================
        // 5. 动画逻辑：手势触发爆炸与聚合
        // ==========================================
        function triggerExplosion() {
            if (currentState === 'exploded') return;
            currentState = 'exploded';
            
            photos.forEach(photo => {
                // 【修改点】配合变大的场景，爆炸半径也变大
                const radius = 15 + Math.random() * 20;
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos(2 * Math.random() - 1);
                
                photo.userData.explodedPos.set(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );

                photo.userData.explodedRot.set(
                    Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI
                );
            });
        }

        function triggerHeart() {
            if (currentState === 'heart') return;
            currentState = 'heart';
        }

        // ==========================================
        // 6. MediaPipe 摄像头手势识别
        // ==========================================
        const videoElement = document.querySelector('.input_video');
        const hands = new Hands({locateFile: (file) => `https://fastly.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, 
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            document.getElementById('loading').style.display = 'none';
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const wrist = landmarks[0];
                const tips = [landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
                const mcps = [landmarks[5], landmarks[9], landmarks[13], landmarks[17]];
                
                let openFingers = 0;
                for (let i = 0; i < 4; i++) {
                    const tipDist = Math.hypot(tips[i].x - wrist.x, tips[i].y - wrist.y);
                    const mcpDist = Math.hypot(mcps[i].x - wrist.x, mcps[i].y - wrist.y);
                    if (tipDist > mcpDist * 1.2) openFingers++;
                }

                if (openFingers >= 3) triggerExplosion(); 
                else if (openFingers <= 1) triggerHeart(); 

                const handCenter = landmarks[9]; 
                targetCameraPos.x = (handCenter.x - 0.5) * -10; 
                targetCameraPos.y = (handCenter.y - 0.5) * -10; 
            } else {
                targetCameraPos.set(0, 0);
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480, facingMode: 'user'
        });
        cameraUtils.start();

        // ==========================================
        // 7. 渲染循环 (物理过渡)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            const heartbeat = 1 + Math.pow(Math.sin(time * 3), 6) * 0.05; 

            camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCameraPos.x, 0.05);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCameraPos.y, 0.05);
            camera.lookAt(0, 0, 0);

            photos.forEach(photo => {
                let targetPos, targetRot;

                if (currentState === 'heart') {
                    targetPos = photo.userData.heartPos;
                    targetRot = photo.userData.heartRot;
                    heartGroup.scale.set(heartbeat, heartbeat, heartbeat); 
                } else {
                    heartGroup.scale.set(1, 1, 1);
                    const floatOffset = photo.userData.randomOffset;
                    const floatX = Math.sin(time * 0.5 + floatOffset) * 0.5;
                    const floatY = Math.cos(time * 0.6 + floatOffset) * 0.5;
                    const floatZ = Math.sin(time * 0.4 + floatOffset) * 0.5;

                    targetPos = photo.userData.explodedPos.clone().add(new THREE.Vector3(floatX, floatY, floatZ));
                    
                    targetRot = photo.userData.explodedRot.clone();
                    targetRot.x += time * 0.2;
                    targetRot.y += time * 0.15;
                }

                const lerpFactor = currentState === 'exploded' ? 0.04 : 0.06; 
                photo.position.lerp(targetPos, lerpFactor);
                
                const currentQuat = new THREE.Quaternion().setFromEuler(photo.rotation);
                const targetQuat = new THREE.Quaternion().setFromEuler(targetRot);
                currentQuat.slerp(targetQuat, lerpFactor);
                photo.rotation.setFromQuaternion(currentQuat);
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
